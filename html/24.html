<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>switch case</title>
</head>
<script>
    var a = prompt("Enter the value of a");
    switch(a){
        case "1":
            document.write("one");
            break;
        case "2":
            document.write("two");
            break;
        case "3":
            document.write("three");
            break;
        default:
            document.write("Invalid input");
    }
</script>
<body>
    
</body>
</html>
