<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>do while loop</title>
    <script>
    var n = prompt("Enter the value of n");
    var i=1;
    do{
        document.write(i+"<br>");
        i++;
    }while(i<=n);
    </script>
</head>
<body>
    
</body>
</html>
