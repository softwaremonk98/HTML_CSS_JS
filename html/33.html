<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working with objects</title>
    <script>
        var message = "Hello! Ravikant";
        var person = {
            name: "Ravikant",
            age: 22,
            city: "Bangalore",
            message: message
        };
        var upperCaseMessage = message.toUpperCase();
        document.write(upperCaseMessage +"<br><br>");
        document.write("Name : "+ person.name + "<br>");
        document.write("Age : "+ person.age + "<br>");
        document.write("City : "+ person.city + "<br>");
        document.write("Message : "+ person.message + "<br>");

        var Employee = new  Object();
        Employee.name = "Ravikant";
        Employee.age = 22;
        Employee.city = "Bangalore";
    </script>
</head>
<body>
    
</body>
</html>
