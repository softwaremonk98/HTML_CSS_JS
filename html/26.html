<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for loop</title>
</head>
<script>
    var n = prompt("Enter the value of n");
    var a = prompt("Enter the value of a");
    for(var i=1;i<=n;i++){
        document.write(a*i+"<br>");
    }
</script>
<body>
    
</body>
</html>
