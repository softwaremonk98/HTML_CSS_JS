<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> pattern using while</title>
    <script>
        //printing pattern using while loop
        var n = prompt("Enter the value of n");
        var i=1;
        while(i<=n){
            var j=1;
            while(j<=i){
                document.write("*");
                j++;
            }
            document.write("<br>");
            i++;
        }   
    </script>
</head>
<body>
    
</body>
</html>
