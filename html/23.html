<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>If Else</title>
</head>
<script>
    var x = prompt("Enter the value of x");
    var y = prompt("Enter the value of y");
    if(x>y){
        document.write("X is greater")
    }
    else{
        document.write("y is greater")
    }
</script>
