<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functions</title>
    <script>
        function myFunction(){
            document.write("This is a Paragraph<br>");
        }
        function myfunction2(x,y)
        {
            document.write("X is "+x+ "<br>" );
            document.write("Y is "+y+ "<br>");
            document.write(x+y);
        }
         function myfunction3(x,y)
        {
            document.write("X is "+x+ "<br>" );
            document.write("Y is "+y+ "<br>");
            document.write(x*y);
        }
        myFunction();
        myfunction2(10,20);
        myfunction3(10,20);
    </script>
</head>
<body>
        
</body>
</html>
