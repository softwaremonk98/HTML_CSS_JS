<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>while loop</title>
    <script>
    var n = prompt("Enter the value of n");
    var i=1;
    while(i<=n){
        document.write(i+"<br>");
        i++;
    }
    </script>
</head>
<body>
    
</body>
</html>
