    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pattern Drawing</title>
</head>
<script>
    var n = prompt("Enter the value of n");
    for(var i=1;i<=n;i++){
        for(var j=1;j<=i;j++){
            document.write("*");
        }
        document.write("<br>");
    }
</script>
